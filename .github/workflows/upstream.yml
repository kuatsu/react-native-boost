name: Upstream (React Native next)
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: React Native next / Metro latest parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run parity
        uses: ./.github/actions/parity
        with:
          react-native: next
          metro: latest

      - name: Collect failures
        if: failure()
        run: node .github/ci/vitest-failures.mjs test-results metro parity > failures.txt

      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failures
          path: failures.txt

  report:
    name: Report
    needs: parity
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: upstream-parity
    steps:
      - name: Checkout
        if: needs.parity.result == 'failure'
        uses: actions/checkout@v7

      - name: Download failures
        if: needs.parity.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: failures

      - name: Report failures
        if: needs.parity.result == 'failure'
        env:
          TITLE: Parity fails against React Native next
          FAILURES_FILE: failures.txt
        run: |
          DETAILS="The scheduled parity run against React Native \`next\` and Metro \`latest\` fails.

          - React Native: $(npm view react-native@next version)
          - Metro: $(npm view metro@latest version)" node .github/ci/report-failures.mjs

      - name: Close issue
        if: needs.parity.result == 'success'
        run: |
          gh issue list --state open --label "$LABEL" --json number --jq '.[].number' | while read -r number; do
            gh issue close "$number" --comment "The scheduled parity run passes again."
          done
