name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: pnpm lint

      - name: Test formatting
        run: pnpm format --check

      - name: Verify formatted code is unchanged
        run: git diff --exit-code HEAD

      - name: Typecheck files
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build plugin
        run: pnpm package build

  parity-matrix:
    name: React Native ${{ matrix.react-native }} / Metro ${{ matrix.metro }} parity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react-native: '0.83'
            metro: '0.83.8'
          - react-native: '0.84'
            metro: '0.83.8'
          - react-native: '0.85'
            metro: '0.84.5'
          - react-native: '0.86'
            metro: '0.84.6'
          - react-native: '0.87'
            metro: '0.87.0'
          - react-native: '0.88'
            metro: '0.88.0'
          - react-native: '0.89.0-rc.1'
            metro: '0.88.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run parity
        uses: ./.github/actions/parity
        with:
          react-native: ${{ matrix.react-native }}
          metro: ${{ matrix.metro }}
