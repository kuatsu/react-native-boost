name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - uses: pnpm/setup@v3
      with:
        node-version-file: false
        cache: true
        require-lockfile: true
